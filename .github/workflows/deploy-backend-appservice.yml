name: Build and deploy Node.js app to Azure Web App - qurantime

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./new q"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./new q/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Zip artifact
        run: zip -r release.zip .next-prod package.json package-lock.json public scripts next.config.mjs src

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: "./new q/release.zip"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "qurantime"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
